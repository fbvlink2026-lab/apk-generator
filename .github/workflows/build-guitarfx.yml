name: Build GuitarFX APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        working-directory: apps/GuitarFX
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradlew -o gradlew
          chmod +x gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        id: build
        working-directory: apps/GuitarFX
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 > build_log.txt || true

      - name: ✅ ISULAT SA errors.md — DIREKTANG GIT COMMIT!
        if: always()
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd apps/GuitarFX
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            LINE="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $SIZE"
          else
            LINE="❌ ERROR — GuitarFX — $DATE — Nabigo ang pagbuo"
          fi

          cd $GITHUB_WORKSPACE
          echo -e "$LINE\n---\n$(cat errors.md)" > NEW.md
          mv NEW.md errors.md

          git config --global user.name "apk-bot"
          git config --global user.email "apk-bot@users.noreply.github.com"
          git add errors.md
          git commit -m "🔄 Auto-Update: errors.md"
          git push https://$TOKEN@github.com/fbvlink2026-lab/apk-generator.git main

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GuitarFX-APK
          path: apps/GuitarFX/app/build/outputs/apk/debug/app-debug.apk
