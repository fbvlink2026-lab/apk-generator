name: Build GuitarFX APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        working-directory: apps/GuitarFX
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradlew -o gradlew
          chmod +x gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        id: build
        working-directory: apps/GuitarFX
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 > build_log.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: ✅ ISULAT SA errors.md — GUMAGAMIT NG GITHUB API!
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: fbvlink2026-lab
          REPO: apk-generator
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd apps/GuitarFX
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            NEW_ENTRY="✅ TAGUMPAY — GuitarFX — $DATE\n✅ APK Nabuo! Laki: $SIZE"
          else
            NEW_ENTRY="❌ ERROR — GuitarFX — $DATE\n❌ Nabigo ang pagbuo.\n---\n$(tail -25 build_log.txt)"
          fi

          # Kunin ang kasalukuyang laman ng errors.md
          RESP=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/contents/errors.md")
          SHA=$(echo "$RESP" | grep -o '"sha": "[^"]*"' | cut -d'"' -f4)
          OLD_CONTENT=$(echo "$RESP" | grep -o '"content": "[^"]*"' | cut -d'"' -f4 | base64 -d)

          # BAGONG LAMAN — Bagong entry sa itaas!
          NEW_CONTENT="$(echo -e "$NEW_ENTRY")\n---\n$OLD_CONTENT"
          ENCODED=$(echo -e "$NEW_CONTENT" | base64 -w 0)

          # I-UPDAT GAMIT ANG API!
          curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$OWNER/$REPO/contents/errors.md" \
            -d '{
              "message": "🔄 Auto-Update: GuitarFX Status",
              "content": "'"$ENCODED"'",
              "sha": "'"$SHA"'"
            }'

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: GuitarFX-APK
          path: apps/GuitarFX/app/build/outputs/apk/debug/app-debug.apk
