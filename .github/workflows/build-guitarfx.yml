name: Build GuitarFX APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        working-directory: apps/GuitarFX
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradlew -o gradlew
          chmod +x gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        id: build
        working-directory: apps/GuitarFX
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 > build_log.txt || true

      - name: ✅ ISULAT SA errors.md — GITHUB_TOKEN!
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd apps/GuitarFX
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            LINE="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $SIZE"
          else
            LINE="❌ ERROR — GuitarFX — $DATE — Nabigo ang pagbuo"
          fi
          
          cd $GITHUB_WORKSPACE
          echo -e "$LINE\n---\n$(cat errors.md)" > NEW_LOG.md
          mv NEW_LOG.md errors.md

      - name: 📝 I-COMMIT PABALIK — GITHUB AUTO-COMMIT!
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Auto-Update: errors.md"
          file_pattern: "errors.md"

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GuitarFX-APK
          path: apps/GuitarFX/app/build/outputs/apk/debug/app-debug.apk
