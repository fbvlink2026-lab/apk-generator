name: Build GuitarFX APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      STATUS: ${{ steps.check.outputs.STATUS }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        working-directory: apps/GuitarFX
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradlew -o gradlew
          chmod +x gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        id: build
        working-directory: apps/GuitarFX
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 > build_log.txt || true

      - name: ✅ TINGNAN KUNG MAY APK
        id: check
        working-directory: apps/GuitarFX
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "STATUS=ERROR" >> $GITHUB_OUTPUT
          fi

      - name: ✅ ISULAT SA errors.md — GITHUB API!
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd apps/GuitarFX
          if [ "${{ steps.check.outputs.STATUS }}" = "SUCCESS" ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            HEADER="✅ TAGUMPAY — GuitarFX — $DATE"
            DETAILS="✅ APK Nabuo! Laki: $SIZE"
          else
            HEADER="❌ ERROR — GuitarFX — $DATE"
            DETAILS="❌ Nabigo ang pagbuo.\n---\n$(tail -25 build_log.txt)"
          fi

          # Kunin ang lumang laman
          RESP=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/fbvlink2026-lab/apk-generator/contents/errors.md")
          SHA=$(echo "$RESP" | grep -o '"sha": "[^"]*"' | cut -d'"' -f4)
          OLD=$(echo "$RESP" | grep -o '"content": "[^"]*"' | cut -d'"' -f4 | base64 -d)

          # Bagong laman — bagong entry sa itaas
          NEW_CONTENT="$(echo -e "$HEADER\n$DETAILS")\n---\n$OLD"
          ENCODED=$(echo -e "$NEW_CONTENT" | base64 -w 0)

          # I-save gamit ang API
          curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/fbvlink2026-lab/apk-generator/contents/errors.md" \
            -d '{
              "message": "🔄 Auto-Update: errors.md",
              "content": "'"$ENCODED"'",
              "sha": "'"$SHA"'"
            }'

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        if: steps.check.outputs.STATUS == 'SUCCESS'
        with:
          name: GuitarFX-APK
          path: apps/GuitarFX/app/build/outputs/apk/debug/app-debug.apk
