name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'guitarfx'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 Listahan ng folder
        run: |
          echo "=== MGA FOLDER SA apps/ ==="
          find apps -maxdepth 1 -mindepth 1 -type d

      - name: 🔨 Build — AWTOMATIKONG AYUSIN ANG GRADLE WRAPPER
        id: do_build
        run: |
          mkdir -p /tmp
          TARGET="${{ github.event.inputs.build_target }}"

          if [ "$TARGET" = "all" ]; then
            APPS=$(find apps -maxdepth 1 -mindepth 1 -type d)
          else
            APPS="apps/$TARGET"
          fi

          > /tmp/errors-content.txt

          for DIR in $APPS; do
            NAME=$(basename "$DIR")
            LOG="/tmp/$NAME-build.log"

            echo "--- BUILD: $NAME ---"
            cd "$DIR"

            if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 10000 ]; then
              echo "⚠️ Kulang/mali ang gradle-wrapper.jar — GINAGAWA NG TUNAY..."
              rm -f gradle/wrapper/gradle-wrapper.jar 2>/dev/null
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
              echo "✅ TUNAY na Gradle wrapper nalikha!"
            fi
            chmod +x gradlew

            ./gradlew assembleDebug > "$LOG" 2>&1
            EXIT=$?
            APK=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)

            {
              echo "===== $NAME ====="
              if [ -n "$APK" ] && [ -f "$APK" ]; then
                echo "✅ TAGUMPAY"
                echo "APK: $APK"
                echo "Laki: $(du -h "$APK" | cut -f1)"
              else
                echo "❌ NABIGO — Exit Code: $EXIT"
              fi
              echo "--- BUONG LOG ---"
              cat "$LOG"
              echo "=================="
              echo ""
            } >> /tmp/errors-content.txt

            cd "$GITHUB_WORKSPACE"
          done

      - name: 📝 Isulat sa errors.md — SIGURADONG TATAKBO
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# Talaan ng mga Build"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "📅 $DATE — 🎯 ${{ github.event.inputs.build_target }}"
            echo "---"
            echo ""
            if [ -f /tmp/errors-content.txt ] && [ -s /tmp/errors-content.txt ]; then
              cat /tmp/errors-content.txt
            else
              echo "⚠️ Walang naprosesang app."
              echo "Tingnan ang hakbang na 'Listahan ng folder' sa itaas."
            fi
          } > errors.md

          echo "✅ Naisulat na errors.md"
          cat errors.md

      - name: 📤 Ipadala APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: apps/*/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ I-commit errors.md
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update build log" 2>/dev/null || true
          git push 2>/dev/null || true
