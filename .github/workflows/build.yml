name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin? (all = lahat ng nasa apps/)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'guitarfx'
          - 'updater'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📋 SHOW SELECTION & LIST ALL APPS
        run: |
          echo "=========================================="
          echo "   🚀 FLEXIBLE BUILD - PARA SA LAHAT NG APP"
          echo "   ✅ TARGET: ${{ github.event.inputs.build_target }}"
          echo "=========================================="
          echo ""
          echo "📂 MGA APP NA NAKITA: "
          ls -la apps/ | grep -E '^d' | awk '{print "   → " $9}'
          echo ""

      - name: 🔨 BUILD APK
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          mkdir -p /tmp/build_logs
          rm -f /tmp/apk_list.txt

          if [ "${{ github.event.inputs.build_target }}" = "all" ]; then
            APPS=$(ls -d apps/*/ 2>/dev/null | grep -v '\.')
          else
            APPS="apps/${{ github.event.inputs.build_target }}/"
          fi

          for APP in $APPS; do
            APP_NAME=$(basename "$APP")
            echo ""
            echo "=========================================="
            echo "   🔨 BUBUIN: $APP_NAME"
            echo "=========================================="

            if [ -f "$APP/gradlew" ]; then
              chmod +x "$APP/gradlew"
              cd "$GITHUB_WORKSPACE/$APP"
              ./gradlew assembleDebug 2>&1 | tee "/tmp/build_logs/$APP_NAME.log"

              if [ -f "build/outputs/apk/debug/*.apk" ]; then
                APK_FILE=$(ls build/outputs/apk/debug/*.apk | head -1)
                echo "$APP_NAME|$APK_FILE|/tmp/build_logs/$APP_NAME.log" >> /tmp/apk_list.txt
              fi
            fi
          done

      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          CONTENT="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"
          CONTENT+="📅 Build: $DATE\n🎯 Target: ${{ github.event.inputs.build_target }}\n---\n\n"

          if [ -f "/tmp/apk_list.txt" ]; then
            while IFS='|' read APP APK LOG; do
              if [ -n "$APP" ]; then
                if [ -f "$APK" ]; then
                  SIZE=$(du -h "$APK" | cut -f1)
                  CONTENT+="✅ TAGUMPAY — $APP — Laki: $SIZE\n"
                else
                  CONTENT+="❌ ERROR — $APP — Nabigo\n"
                fi
                CONTENT+="---\n"
              fi
            done < /tmp/apk_list.txt
          fi

          echo -e "$CONTENT" > errors.md

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: apps/**/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml errors.md
          git commit -m "✅ Update: Flexible Build - Pumili ng App" || true
          git push
