name: Build APK

on:
  push:
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'guitarfx'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 BUONG LISTAHAN NG LAHAT NG FOLDER — ALAMIN NATIN KUNG NASAN!
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA BUONG REPOSITORY"
          echo "=========================================="
          find . -maxdepth 3 -type d | grep -v '.git' | sort
          echo ""
          echo "=========================================="
          echo "   🔍 TIGNAN KUNG NASAAN ANG Updater:"
          echo "=========================================="
          if [ -d "apps/GitHubUpdater" ]; then
            echo "✅ NASA: apps/GitHubUpdater"
          fi
          if [ -d "GitHubUpdater" ]; then
            echo "✅ NASA: GitHubUpdater (diretso sa ugat!)"
          fi
          if [ -d "apps/GitHubUpdater/app" ]; then
            echo "✅ May app/ sa loob: apps/GitHubUpdater/app"
          fi
          echo ""
          ls -la

      - name: 🔨 Build at Kumuha ng Log
        id: do_build
        run: |
          mkdir -p /tmp
          TARGET="${{ github.event.inputs.build_target }}"
          > /tmp/errors-content.txt

          # ✅ HANAPIN SA LAHAT NG POSIBLENG LUGAR
          FIND_APP() {
            local NAME="$1"
            if [ -d "apps/$NAME" ]; then echo "apps/$NAME"; return 0; fi
            if [ -d "$NAME" ]; then echo "$NAME"; return 0; fi
            return 1
          }

          declare -a APPS=()

          if [ "$TARGET" = "all" ]; then
            DIR=$(FIND_APP GitHubUpdater) && APPS+=("$DIR")
            DIR=$(FIND_APP GuitarFX) && APPS+=("$DIR")
          else
            DIR=$(FIND_APP "$TARGET") && APPS+=("$DIR")
          fi

          echo "✅ MGA APP NA MAHANAP: ${APPS[*]}"

          if [ ${#APPS[@]} -eq 0 ]; then
            echo "⚠️ WALANG MAHANAP NA APP — tignan ang listahan sa itaas!"
            exit 0
          fi

          for DIR in "${APPS[@]}"; do
            NAME=$(basename "$DIR")
            LOG="/tmp/$NAME-build.log"

            echo ""
            echo "--- BUILD: $NAME — Daan: $DIR ---"
            cd "$DIR" || continue

            # ✅ AYUSIN ANG GRADLE WRAPPER
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 10000 ]; then
              echo "⚠️ Ayusin ang gradle-wrapper..."
              rm -f gradle/wrapper/gradle-wrapper.jar 2>/dev/null
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
            fi
            chmod +x gradlew

            ./gradlew assembleDebug > "$LOG" 2>&1 || true
            EXIT=$?
            APK=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)

            {
              echo "===== $NAME ====="
              if [ -n "$APK" ] && [ -f "$APK" ]; then
                echo "✅ TAGUMPAY"
                echo "APK: $APK"
              else
                echo "❌ NABIGO — Exit $EXIT"
              fi
              echo "--- BUONG LOG ---"
              cat "$LOG"
              echo "=================="
              echo ""
            } >> /tmp/errors-content.txt

            cd "$GITHUB_WORKSPACE"
          done

      - name: 📝 Isulat sa errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# Talaan ng mga Build"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "📅 $DATE — 🎯 ${{ github.event.inputs.build_target }}"
            echo "---"
            echo ""
            if [ -f /tmp/errors-content.txt ] && [ -s /tmp/errors-content.txt ]; then
              cat /tmp/errors-content.txt
            else
              echo "⚠️ Walang naprosesang app."
              echo ""
              echo "💡 TIGNAN ANG UNANG HAKBANG — doon mo makikita:"
              echo "   • Kung saang folder nakalagay ang GitHubUpdater"
              echo "   • Kung naipadala ba talaga sa GitHub"
            fi
          } > errors.md
          cat errors.md

      - name: 📤 Ipadala APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: |
            */build/outputs/apk/debug/*.apk
            */app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ I-commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update build log" || true
          git push || true
