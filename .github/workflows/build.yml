name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'guitarfx'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📋 LISTAHAN NG MGA FOLDER SA apps/
        id: list_folders
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA apps/"
          echo "=========================================="
          ls -la apps/
          echo ""
          find apps -maxdepth 1 -mindepth 1 -type d
          echo ""
          echo "✅ KUNG WALANG LUMABAS — WALANG FOLDER SA apps/"

      - name: 🔨 BUILD APK
        id: build_step
        continue-on-error: true   # ✅ HINDI HIHINTO KAHIT PUMULA
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          mkdir -p /tmp/build_logs
          rm -f /tmp/apk_list.txt
          touch /tmp/apk_list.txt   # ✅ SIGURADONG MAY FILE

          TARGET="${{ github.event.inputs.build_target }}"
          
          if [ "$TARGET" = "all" ]; then
            mapfile -t APPS < <(find apps -maxdepth 1 -mindepth 1 -type d | sort)
          else
            APPS=("apps/$TARGET")
          fi

          echo "=========================================="
          echo "   🎯 TARGET: $TARGET"
          echo "   📂 IPAPROSESO: ${APPS[*]}"
          echo "=========================================="

          for APP in "${APPS[@]}"; do
            APP_NAME=$(basename "$APP")
            LOG_FILE="/tmp/build_logs/$APP_NAME.log"

            echo ""
            echo "📂 PUMAPASOK SA: $APP"
            
            if [ ! -d "$APP" ]; then
              echo "❌ HINDI MAHANAP ANG FOLDER: $APP"
              echo "$APP_NAME||$LOG_FILE|FOLDER_NOT_FOUND" >> /tmp/apk_list.txt
              continue
            fi

            cd "$GITHUB_WORKSPACE/$APP" || continue

            if [ ! -f gradlew ]; then
              echo "⚠️ Walang gradlew — ginagawa..."
              gradle wrapper --gradle-version 8.2
            fi
            chmod +x gradlew

            echo "🔨 NAGSISIMULA ANG BUILD..."
            ./gradlew assembleDebug > "$LOG_FILE" 2>&1
            EXIT_CODE=$?
            echo "EXIT_CODE=$EXIT_CODE" >> "$LOG_FILE"

            APK_FILE=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)

            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              echo "✅ APK NABUO: $APK_FILE"
              echo "$APP_NAME|$APK_FILE|$LOG_FILE|SUCCESS" >> /tmp/apk_list.txt
            else
              echo "❌ WALANG APK — Exit Code: $EXIT_CODE"
              echo "$APP_NAME||$LOG_FILE|FAILED-$EXIT_CODE" >> /tmp/apk_list.txt
            fi
          done

          echo ""
          echo "📋 BUOD NG NAIPROSESO:"
          cat /tmp/apk_list.txt

      # ==============================================
      # 📝 SIGURADONG TATAKBO — KAHIT ANONG MANGYARI
      # ==============================================
      - name: 📝 Update errors.md
        id: write_errors
        if: always()   # ✅ TATAKBO KAHIT PUMULA O MATAGAL
        run: |
          echo "✅ NAGSUSULAT SA ERRORS.MD..."
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          CONTENT="# Talaan ng mga Build\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"
          CONTENT+="📅 Build: **$DATE**\n🎯 Target: **${{ github.event.inputs.build_target }}**\n---\n\n"

          if [ -f "/tmp/apk_list.txt" ] && [ -s "/tmp/apk_list.txt" ]; then
            while IFS='|' read APP APK LOG STATUS || [ -n "$APP" ]; do
              if [ -n "$APP" ]; then
                CONTENT+="### 📦 $APP\n"
                if [[ "$STATUS" == SUCCESS ]]; then
                  SIZE=$(du -h "$APK" 2>/dev/null | cut -f1 || echo "---")
                  CONTENT+="✅ **TAGUMPAY** — Laki: $SIZE\n\n"
                elif [[ "$STATUS" == FOLDER_NOT_FOUND ]]; then
                  CONTENT+="❌ **HINDI MAHANAP ANG FOLDER** — apps/$APP\n"
                  CONTENT+="> 💡 Suriin: tama ba ang pangalan?\n\n"
                else
                  CONTENT+="❌ **NABIGO ANG BUILD** — $STATUS\n\n"
                fi

                if [ -f "$LOG" ]; then
                  CONTENT+="#### 📋 Buong Log:\n\`\`\`\n"
                  CONTENT+="$(cat "$LOG")"
                  CONTENT+="\n\`\`\`\n\n"
                fi
                CONTENT+="---\n\n"
              fi
            done < /tmp/apk_list.txt
          else
            CONTENT+="⚠️ **Walang naitalang app.**\n\n"
            CONTENT+="> 💡 Posibleng dahilan:\n"
            CONTENT+="> • Walang folder sa loob ng `apps/`\n"
            CONTENT+="> • Maling pangalan ng target\n"
            CONTENT+="> • Tingnan ang hakbang na 'LISTAHAN NG MGA FOLDER' sa itaas — makikita mo kung ano ang nakita\n\n"
          fi

          # ✅ Panatilihin ang lumang tala
          if [ -f errors.md ]; then
            OLD=$(cat errors.md)
            OLD_TAIL=$(echo "$OLD" | sed -n '/^---$/,$p' | sed '1d')
            if [ -n "$OLD_TAIL" ]; then
              CONTENT="$CONTENT\n$OLD_TAIL"
            fi
          fi

          echo -e "$CONTENT" > errors.md
          echo "✅ TAPOS NA — NAISULAT SA ERRORS.MD!"
          cat errors.md   # ✅ Ipakita sa Actions — para makita mo agad

      - name: 📤 Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: apps/*/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ I-commit at i-push ang errors.md
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update build log — ${{ github.event.inputs.build_target }}" || true
          git push || true
          echo "✅ Naipadala na ang errors.md sa GitHub"
