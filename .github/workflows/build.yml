name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'guitarfx'
          - 'updater'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Prepare Log Folder
        run: mkdir -p /tmp/build_logs

