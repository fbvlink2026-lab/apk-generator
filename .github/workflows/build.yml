name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang bubuuin?'
        required: true
        default: 'updater'
        type: choice
        options:
          - 'updater'
          - 'guitarfx'
          - 'all'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 + Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==============================================
      # 📱 GITHUB UPDATER — BUUIN
      # ==============================================
      - name: 🔨 Build GitHubUpdater
        id: build_updater
        if: github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all'
        run: |
          cd apps/GitHubUpdater
          
          # ✅ SIGURADUHING TAMA ANG GRADLE WRAPPER — KUNG WALANG .jar, GUMAMIT NG SYSTEM GRADLE
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar) -lt 100 ]; then
              echo "⚠️ Wala o mali ang gradle-wrapper.jar — AWTOMATIKONG LILIKHA..."
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
              echo "✅ Nalikha na ang tamang Gradle wrapper!"
          fi
          
          chmod +x ./gradlew
          
          ./gradlew assembleDebug 2>&1 | tee ../../updater-build-full.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/*" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: 📤 Upload Updater APK
        if: always() && steps.build_updater.outputs.APK_PATH
        uses: actions/upload-artifact@v4
        with:
          name: GitHubUpdater-APK
          path: ${{ steps.build_updater.outputs.APK_PATH }}
          retention-days: 14

      # ==============================================
      # 🎸 GUITARFX — BUUIN
      # ==============================================
      - name: 🔨 Build GuitarFX
        id: build_guitarfx
        if: github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all'
        run: |
          cd apps/GuitarFX
          
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar) -lt 100 ]; then
              echo "⚠️ Wala o mali ang gradle-wrapper.jar — AWTOMATIKONG LILIKHA..."
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
          fi
          
          chmod +x ./gradlew
          
          ./gradlew assembleDebug 2>&1 | tee ../../guitarfx-build-full.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/*" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: 📤 Upload GuitarFX APK
        if: always() && steps.build_guitarfx.outputs.APK_PATH
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFX-APK
          path: ${{ steps.build_guitarfx.outputs.APK_PATH }}
          retention-days: 14

      # ==============================================
      # 📝 UPDATE ERRORS.MD — KASAMA ANG BUONG LOG
      # ==============================================
      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          
          FINAL_CONTENT="# Talaan ng mga Build\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"

          # --- GITHUB UPDATER ---
          if [[ "${{ github.event.inputs.build_target }}" == "updater" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            EXIT="${{ steps.build_updater.outputs.EXIT_CODE }}"
            APK="${{ steps.build_updater.outputs.APK_PATH }}"
            
            if [ "$EXIT" == "0" ] && [ -n "$APK" ]; then
              SIZE=$(du -h "$APK" 2>/dev/null | cut -f1 || echo "---")
              FINAL_CONTENT+="✅ **TAGUMPAY** — GitHubUpdater — $DATE\n"
              FINAL_CONTENT+="> Bersyon: 1.0.0 | Laki: $SIZE | APK ✅\n\n"
            else
              FINAL_CONTENT+="❌ **NABIGO** — GitHubUpdater — $DATE\n"
              FINAL_CONTENT+="> Exit Code: $EXIT\n\n"
              
              if [ -f "updater-build-full.log" ]; then
                FINAL_CONTENT+="### 📋 BUONG LOG:\n\`\`\`\n"
                FINAL_CONTENT+="$(cat updater-build-full.log | head -300)\n\`\`\`\n\n"
              fi
            fi
            FINAL_CONTENT+="---\n"
          fi

          # --- GUITARFX ---
          if [[ "${{ github.event.inputs.build_target }}" == "guitarfx" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            EXIT="${{ steps.build_guitarfx.outputs.EXIT_CODE }}"
            APK="${{ steps.build_guitarfx.outputs.APK_PATH }}"
            
            if [ "$EXIT" == "0" ] && [ -n "$APK" ]; then
              SIZE=$(du -h "$APK" 2>/dev/null | cut -f1 || echo "---")
              FINAL_CONTENT+="✅ **TAGUMPAY** — GuitarFX — $DATE\n"
              FINAL_CONTENT+="> Bersyon: 1.0.0 | Laki: $SIZE | APK ✅\n\n"
            else
              FINAL_CONTENT+="❌ **NABIGO** — GuitarFX — $DATE\n"
              FINAL_CONTENT+="> Exit Code: $EXIT\n\n"
              
              if [ -f "guitarfx-build-full.log" ]; then
                FINAL_CONTENT+="### 📋 BUONG LOG:\n\`\`\`\n"
                FINAL_CONTENT+="$(cat guitarfx-build-full.log | head -300)\n\`\`\`\n\n"
              fi
            fi
            FINAL_CONTENT+="---\n"
          fi

          # Panatilihin ang lumang tala
          if [ -f errors.md ]; then
            OLD_CONTENT=$(cat errors.md)
            OLD_CONTENT=$(echo "$OLD_CONTENT" | sed -n '/^---$/,$p' | sed '1d')
            FINAL_CONTENT="$FINAL_CONTENT$OLD_CONTENT"
          fi

          echo -e "$FINAL_CONTENT" > errors.md

      - name: ✅ I-save ang errors.md
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git add errors.md
          git commit -m "📝 Update build log" || true
          git push || true
