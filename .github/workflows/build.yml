name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 ALIN ANG BUBUUIN?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'guitarfx'
          - 'updater'

jobs:
  build:
    name: 📱 BUILD — ${{ inputs.build_target }}
    runs-on: ubuntu-latest
    permissions: { contents: read }

    steps:
      - uses: actions/checkout@v4

      - name: ☕ JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🎸 BUILD GUITARFX
        if: inputs.build_target == 'guitarfx' || inputs.build_target == 'all'
        working-directory: apps/GuitarFX
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_FILE=app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK_FILE" ] && echo "GUITARFX_APK=$PWD/$APK_FILE" >> $GITHUB_ENV || exit 1

      - name: 🔄 BUILD UPDATER
        if: inputs.build_target == 'updater' || inputs.build_target == 'all'
        working-directory: apps/GitHubUpdater
        run: |
          [ -f gradlew ] && chmod +x gradlew && ./gradlew assembleDebug || gradle assembleDebug
          APK_FILE=app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK_FILE" ] && echo "UPDATER_APK=$PWD/$APK_FILE" >> $GITHUB_ENV || exit 1

      - name: 📤 UPLOAD GUITARFX
        if: inputs.build_target == 'guitarfx' || inputs.build_target == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFX-APK
          path: ${{ env.GUITARFX_APK }}
          if-no-files-found: error

      - name: 📤 UPLOAD UPDATER
        if: inputs.build_target == 'updater' || inputs.build_target == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: MartoDosko-Updater-APK
          path: ${{ env.UPDATER_APK }}
          if-no-files-found: error
