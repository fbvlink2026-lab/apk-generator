name: Build APK

on:
  push:
    paths:
      - 'apps/GitHubUpdater/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang bubuuin?'
        required: true
        default: 'updater'
        type: choice
        options:
          - 'updater'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ==============================================
      # 📱 GITHUB UPDATER — BUILD
      # ==============================================
      - name: 🔨 Build GitHubUpdater
        id: build_updater
        run: |
          cd apps/GitHubUpdater
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/*" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: 📤 Upload Updater APK
        if: steps.build_updater.outputs.APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: GitHubUpdater-APK
          path: ${{ steps.build_updater.outputs.APK_PATH }}
          retention-days: 14

      # ==============================================
      # 📝 UPDATE ERRORS.MD — KAHIT ANONG MANGYARI
      # ==============================================
      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          
          FINAL_CONTENT="# Talaan ng mga Build\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"

          EXIT="${{ steps.build_updater.outputs.EXIT_CODE }}"
          APK="${{ steps.build_updater.outputs.APK_PATH }}"

          if [ "$EXIT" == "0" ] && [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" 2>/dev/null | cut -f1 || echo "---")
            FINAL_CONTENT+="✅ **TAGUMPAY** — GitHubUpdater — $DATE\n"
            FINAL_CONTENT+="> Bersyon: 1.0.0 | Laki: $SIZE | APK Nasa Artifacts ✅\n\n"
          else
            FINAL_CONTENT+="❌ **NABIGO** — GitHubUpdater — $DATE\n"
            FINAL_CONTENT+="> Exit Code: $EXIT | Suriin ang Workflow Log ⬇️\n\n"
          fi
          FINAL_CONTENT+="---\n"

          # Panatilihin ang lumang tala
          if [ -f errors.md ]; then
            OLD_CONTENT=$(cat errors.md)
            OLD_CONTENT=$(echo "$OLD_CONTENT" | sed -n '/^---$/,$p' | sed '1d')
            FINAL_CONTENT="$FINAL_CONTENT$OLD_CONTENT"
          fi

          echo -e "$FINAL_CONTENT" > errors.md
          echo "✅ Na-update ang errors.md"

      - name: ✅ I-commit at I-push ang errors.md
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git add errors.md
          git commit -m "📝 Update build log — $(date +%Y-%m-%d)" || true
          git push || true
ENDOFFILE

echo "✅ build.yml — NA-UPDATE!"
echo "   📌 Tanging 'updater' lang ang kasali — GuitarFX mamaya"
