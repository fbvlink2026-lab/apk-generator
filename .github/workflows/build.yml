name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'guitarfx'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 Anong mga folder ang nakita?
        run: |
          echo "=== MGA FOLDER SA apps/ ==="
          ls -la apps/
          echo ""
          echo "=== TUNAY NA LISTAHAN NG FOLDER ==="
          find apps -maxdepth 1 -mindepth 1 -type d

      - name: 🔨 Build at Kumuha ng Log
        id: do_build
        run: |
          mkdir -p /tmp
          TARGET="${{ github.event.inputs.build_target }}"

          # ✅ INAYOS — SIGURADONG MAHANAP ANG MGA FOLDER
          if [ "$TARGET" = "all" ]; then
            mapfile -t APPS < <(find apps -maxdepth 1 -mindepth 1 -type d | sort)
          else
            APPS=("apps/$TARGET")
          fi

          echo "✅ MGA APP NA IPAPROSESO: ${APPS[*]}"
          > /tmp/errors-content.txt

          for DIR in "${APPS[@]}"; do
            NAME=$(basename "$DIR")
            LOG="/tmp/$NAME-build.log"

            echo ""
            echo "--- BUILD: $NAME ---"
            echo "📂 Daan: $DIR"

            if [ ! -d "$DIR" ]; then
              echo "❌ HINDI MAHANAP ANG FOLDER — LILIPAT SA SUSUNOD"
              echo "$NAME||$LOG|FOLDER_NOT_FOUND" >> /tmp/errors-content.txt
              continue
            fi

            cd "$DIR" || continue

            # ✅ AYUSIN MUNA ANG GRADLE WRAPPER — KUNG KULANG ANG .jar
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 10000 ]; then
              echo "⚠️ Kulang/mali ang gradle-wrapper.jar — GINAGAWA NG TUNAY..."
              rm -f gradle/wrapper/gradle-wrapper.jar 2>/dev/null
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
              echo "✅ TUNAY na Gradle wrapper nalikha!"
            fi
            chmod +x gradlew

            ./gradlew assembleDebug > "$LOG" 2>&1 || true
            EXIT=$?
            APK=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)

            {
              echo "===== $NAME ====="
              if [ -n "$APK" ] && [ -f "$APK" ]; then
                echo "✅ TAGUMPAY"
                echo "APK: $APK"
              elif [ "$STATUS" = "FOLDER_NOT_FOUND" ]; then
                echo "❌ HINDI MAHANAP ANG FOLDER: $DIR"
              else
                echo "❌ NABIGO — Exit $EXIT"
              fi
              echo "--- BUONG LOG ---"
              cat "$LOG"
              echo "=================="
              echo ""
            } >> /tmp/errors-content.txt

            cd "$GITHUB_WORKSPACE"
          done

          echo ""
          echo "=== BUOD NG NAIPROSESO ==="
          cat /tmp/errors-content.txt

      - name: 📝 Isulat sa errors.md — SIGURADONG TATAKBO
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# Talaan ng mga Build"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "📅 $DATE — 🎯 ${{ github.event.inputs.build_target }}"
            echo "---"
            echo ""
            if [ -f /tmp/errors-content.txt ] && [ -s /tmp/errors-content.txt ]; then
              cat /tmp/errors-content.txt
            else
              echo "⚠️ Walang naprosesang app."
              echo ""
              echo "💡 Posibleng dahilan:"
              echo "• Walang folder sa loob ng apps/"
              echo "• Maling pangalan ng target — dapat: GitHubUpdater (hindi updater)"
              echo "• Tingnan ang hakbang 'Anong mga folder ang nakita?' sa itaas — makikita mo kung ano talaga ang nakita"
            fi
          } > errors.md

          echo "✅ Naisulat na ang errors.md — laman:"
          cat errors.md

      - name: 📤 Ipadala APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: apps/*/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ I-commit ang errors.md + naayos na Gradle wrapper
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git add apps/*/gradle/wrapper/ 2>/dev/null || true
          git add apps/*/gradlew 2>/dev/null || true
          git commit -m "📝 Update build log + Ayos: Gradle Wrapper" || true
          git push || true
