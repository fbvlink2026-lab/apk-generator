name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'apk:') || contains(github.event.head_commit.message, 'apps/') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📦 Grant Execute Permission
        run: |
          chmod +x apps/GuitarFX/gradlew
          echo "✅ Permission granted"

      - name: 🔨 Build APK
        id: build
        run: |
          cd apps/GuitarFX
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_output.log
        shell: bash

      - name: 📝 Update errors.md — SIMPLE + LOG!
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd apps/GuitarFX
          
          BUILD_LOG="/tmp/build_output.log"
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            LINE="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $SIZE"
            EXTRA=""
          else
            LINE="❌ ERROR — GuitarFX — $DATE — Nabigo ang pagbuo"
            echo "🔍 Kinukuha ang log..."
            
            if [ -f "$BUILD_LOG" ]; then
              EXTRA="\n---\n### 📋 BUONG LOG:\n\`\`\`\n$(tail -80 "$BUILD_LOG")\n\`\`\`\n"
            else
              EXTRA="\n---\n> ⚠️ Walang log file. Tingnan ang Actions page."
            fi
          fi
          
          cd $GITHUB_WORKSPACE
          
          NEW_ENTRY="$LINE$EXTRA\n---\n"
          
          if [ -f errors.md ]; then
            OLD_CONTENT=$(cat errors.md)
            OLD_CONTENT=$(echo "$OLD_CONTENT" | sed '/^# Talaan ng mga Error$/d' | sed '/^---$/!b' | sed '1,/^---$/d')
            FINAL="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n$NEW_ENTRY$OLD_CONTENT"
          else
            FINAL="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n$NEW_ENTRY"
          fi
          
          echo -e "$FINAL" > errors.md
          echo "✅ Na-update ang errors.md — may buong log na!"
        shell: /usr/bin/bash -e {0}

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GuitarFX-APK
          path: apps/GuitarFX/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Log
          path: /tmp/build_output.log
          retention-days: 30

      - name: ✅ Commit & Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: errors.md
          commit_message: 🔄 Auto-Update: errors.md — May Log!
          commit_user_name: fbvlink2026-lab
          commit_user_email: 302709664+fbvlink2026-lab@users.noreply.github.com
