name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang bubuuin?'
        required: true
        default: 'updater'
        type: choice
        options:
          - 'updater'
          - 'guitarfx'
          - 'all'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ==============================================
      # 📱 GITHUB UPDATER — BUUIN + KUNIN ANG BUONG LOG
      # ==============================================
      - name: 🔨 Build GitHubUpdater
        id: build_updater
        if: github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all'
        run: |
          cd apps/GitHubUpdater
          
          # Ayusin wrapper kung kulang
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 100 ]; then
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
          fi
          chmod +x ./gradlew
          
          # ✅ KUNIN ANG LAHAT — OUTPUT + ERROR — ISAIP SA FILE
          ./gradlew assembleDebug 2>&1 > ../../build-output.log
          EXIT_CODE=$?
          
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/*" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: 📤 Upload Updater APK
        if: always() && steps.build_updater.outputs.APK_PATH
        uses: actions/upload-artifact@v4
        with:
          name: GitHubUpdater-APK
          path: ${{ steps.build_updater.outputs.APK_PATH }}
          retention-days: 14

      # ==============================================
      # 📝 ISULAT SA ERRORS.MD — KASAMA ANG BUONG LOG
      # ==============================================
      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          FINAL_CONTENT="# Talaan ng mga Build\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"

          EXIT="${{ steps.build_updater.outputs.EXIT_CODE }}"
          APK="${{ steps.build_updater.outputs.APK_PATH }}"

          if [ "$EXIT" == "0" ] && [ -n "$APK" ]; then
              SIZE=$(du -h "$APK" 2>/dev/null | cut -f1 || echo "---")
              FINAL_CONTENT+="✅ **TAGUMPAY** — GitHubUpdater — $DATE\n"
              FINAL_CONTENT+="> Bersyon: 1.0.0 | Laki: $SIZE\n\n"
          else
              FINAL_CONTENT+="❌ **NABIGO** — GitHubUpdater — $DATE\n"
              FINAL_CONTENT+="> Exit Code: $EXIT\n\n"
              
              # ✅ BASAHIN ANG BUONG LOG — WALANG PINUTOL
              if [ -f build-output.log ]; then
                  FINAL_CONTENT+="### 📋 BUONG LOG NG BUILD:\n"
                  FINAL_CONTENT+="\`\`\`\n"
                  FINAL_CONTENT+="$(cat build-output.log)\n"
                  FINAL_CONTENT+="\`\`\`\n\n"
              else
                  FINAL_CONTENT+="⚠️ Walang nakuhang log file.\n\n"
              fi
          fi
          FINAL_CONTENT+="---\n"

          # Panatilihin ang lumang tala
          if [ -f errors.md ]; then
              OLD_CONTENT=$(cat errors.md)
              OLD_CONTENT=$(echo "$OLD_CONTENT" | sed -n '/^---$/,$p' | sed '1d')
              FINAL_CONTENT="$FINAL_CONTENT$OLD_CONTENT"
          fi

          echo -e "$FINAL_CONTENT" > errors.md

      - name: 🧹 Linisin
        if: always()
        run: rm -f build-output.log

      - name: ✅ I-save errors.md
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git add errors.md
          git commit -m "📝 Update build log" || true
          git push || true
