name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'apk:') || contains(github.event.head_commit.message, 'apps/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: ✅ APK detected — Building...
        run: echo "Tumatakbo LAMANG para sa APK files sa apps/"

# ==========================================
# ✅ DITO ANG DAGDAG — WALANG BINAGO SA NASA TAAS
# ==========================================

      - name: 🏷️ KUNIN ANG BERSYON MULA SA TAG
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v6.0.4")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle
        run: |
          FILE="apps/GitHubUpdater/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: ☕ I-setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Gradle Wrapper
        working-directory: apps/GitHubUpdater
        run: |
          [ ! -f gradlew ] && gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 🔨 BUUIN ANG APK
        id: build_step
        working-directory: apps/GitHubUpdater
        run: ./gradlew assembleDebug 2>&1 | tee build.log
        shell: bash

# ==========================================
# ✅ NANDITO PA RIN — PAGSUSULAT SA errors.md!
# ==========================================
      - name: 📋 ISULAT ANG RESULTA SA errors.md
        if: always()
        run: |
          STATUS="✅ TAGUMPAY"
          EXIT_CODE=0
          if [ "${{ steps.build_step.outcome }}" == "failure" ]; then
            STATUS="❌ NABIGO"
            EXIT_CODE=1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          VER_TAG="${{ steps.version.outputs.tag }}"

          echo -e "\n---" >> errors.md
          echo -e "📅 Petsa: $TIMESTAMP 🎯 Target: GitHubUpdater" >> errors.md
          echo -e "" >> errors.md
          echo -e "==================================================" >> errors.md
          echo -e "📦 APLIKASYON: GitHubUpdater" >> errors.md
          echo -e "📂 LOKASYON: apps/GitHubUpdater" >> errors.md
          echo -e "⏰ ORAS: $TIMESTAMP" >> errors.md
          echo -e "" >> errors.md
          echo -e "$STATUS — Exit $EXIT_CODE" >> errors.md
          echo -e "" >> errors.md
          echo -e "📋 BUONG LOG NG BUILD:" >> errors.md
          if [ -f "apps/GitHubUpdater/build.log" ]; then
            cat apps/GitHubUpdater/build.log >> errors.md
          else
            echo "Walang log file." >> errors.md
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git diff --staged --quiet || (git commit -m "📝 Update build log: $VER_TAG" && git push)

# ==========================================
# ✅ DAGDAG — ILIPAT ANG APK AT I-UPLOAD
# ==========================================
      - name: 📦 ILIPAT → docs/install-...apk
        if: success()
        run: |
          mkdir -p docs
          APK_SRC="apps/GitHubUpdater/app/build/outputs/apk/debug/app-debug.apk"
          APK_DST="docs/install-GitHubUpdater-${{ steps.version.outputs.tag }}.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DST"
            echo "✅ NAI-SAVE: $APK_DST"
          else
            echo "❌ WALANG APK NAKITA"
            exit 1
          fi

      - name: 📤 I-COMMIT ANG APK
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/install-*.apk
          git add apps/GitHubUpdater/app/build.gradle
          git diff --staged --quiet || git commit -m "📦 Build: install-GitHubUpdater ${{ steps.version.outputs.tag }}" && git push

      - name: 📋 I-UPLOAD BILANG ARTIFACT
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: install-GitHubUpdater-${{ steps.version.outputs.tag }}
          path: docs/install-*.apk
