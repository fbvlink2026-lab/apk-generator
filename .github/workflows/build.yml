name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'updater'
        type: choice
        options:
          - 'updater'
          - 'guitarfx'
          - 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Prepare Log Folder
        run: mkdir -p /tmp/build_logs

      # ==============================================
      # 📱 GITHUB UPDATER
      # ==============================================
      - name: 🔨 Build GitHubUpdater
        id: build_updater
        if: github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all'
        run: |
          LOG_FILE="/tmp/build_logs/updater.log"
          echo "=== START BUILD: $(date) ===" > "$LOG_FILE"
          cd apps/GitHubUpdater
          [ -f gradlew ] && chmod +x gradlew
          ./gradlew assembleDebug >> "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> "$LOG_FILE"
          APK_FOUND=$(find . -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_FOUND" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        shell: bash

      - name: 📤 Upload Updater APK
        id: upload_updater
        uses: actions/upload-artifact@v4
        if: always() && steps.build_updater.outputs.apk_path && (github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all')
        with:
          name: GitHubUpdater-APK
          path: ${{ steps.build_updater.outputs.apk_path }}
          retention-days: 30

      # ==============================================
      # 🎸 GUITARFX — TAMA NA ANG PATH — WALANG AYOS NA KAILANGAN!
      # ==============================================
      - name: 🔨 Build GuitarFX
        id: build_guitarfx
        if: github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all'
        run: |
          LOG_FILE="/tmp/build_logs/guitarfx.log"
          echo "=== START BUILD: $(date) ===" > "$LOG_FILE"
          cd apps/GuitarFX
          chmod +x gradlew
          ./gradlew assembleDebug >> "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> "$LOG_FILE"
          APK_FOUND=$(find . -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_FOUND" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        shell: bash

      - name: 📤 Upload GuitarFX APK
        id: upload_guitarfx
        uses: actions/upload-artifact@v4
        if: always() && steps.build_guitarfx.outputs.apk_path && (github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all')
        with:
          name: GuitarFX-APK
          path: ${{ steps.build_guitarfx.outputs.apk_path }}
          retention-days: 30

      # ==============================================
      # 📝 ERRORS.MD — BUO! WALANG BINAGO!
      # ==============================================
      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd $GITHUB_WORKSPACE
          
          FINAL_CONTENT="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"

          if [[ "${{ github.event.inputs.build_target }}" == "updater" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            EXIT="${{ steps.build_updater.outputs.exit_code }}"
            APK_PATH="${{ steps.build_updater.outputs.apk_path }}"
            UPLOAD_SUCCESS="${{ steps.upload_updater.outcome }}"
            
            if [ "$EXIT" = "0" ] && [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
              SIZE=$(du -h "$APK_PATH" | cut -f1)
              if [ "$UPLOAD_SUCCESS" = "success" ]; then
                FINAL_CONTENT+="✅ TAGUMPAY — GitHubUpdater — $DATE — Laki: $SIZE — APK NA SA ARTIFACTS!\n"
              else
                FINAL_CONTENT+="⚠️ NABUO ANG APK PERO HINDI NA-UPLOAD — GitHubUpdater — $DATE — Laki: $SIZE\n"
              fi
            elif [ "$EXIT" = "0" ]; then
              FINAL_CONTENT+="⚠️ SUCCESS ANG BUILD PERO WALANG APK FILE — GitHubUpdater — $DATE\n"
            else
              FINAL_CONTENT+="❌ NABIGO ANG BUILD — GitHubUpdater — $DATE — Code: $EXIT\n"
            fi
            FINAL_CONTENT+="---\n"
          fi

          if [[ "${{ github.event.inputs.build_target }}" == "guitarfx" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            EXIT="${{ steps.build_guitarfx.outputs.exit_code }}"
            APK_PATH="${{ steps.build_guitarfx.outputs.apk_path }}"
            UPLOAD_SUCCESS="${{ steps.upload_guitarfx.outcome }}"
            
            if [ "$EXIT" = "0" ] && [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
              SIZE=$(du -h "$APK_PATH" | cut -f1)
              if [ "$UPLOAD_SUCCESS" = "success" ]; then
                FINAL_CONTENT+="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $SIZE — APK NA SA ARTIFACTS!\n"
              else
                FINAL_CONTENT+="⚠️ NABUO ANG APK PERO HINDI NA-UPLOAD — GuitarFX — $DATE — Laki: $SIZE\n"
              fi
            elif [ "$EXIT" = "0" ]; then
              FINAL_CONTENT+="⚠️ SUCCESS ANG BUILD PERO WALANG APK FILE — GuitarFX — $DATE\n"
            else
              FINAL_CONTENT+="❌ NABIGO ANG BUILD — GuitarFX — $DATE — Code: $EXIT\n"
            fi
            FINAL_CONTENT+="---\n"
          fi
          
          if [ -f errors.md ]; then
            OLD_CONTENT=$(cat errors.md)
            OLD_CONTENT=$(echo "$OLD_CONTENT" | sed -n '/^---$/,$p' | sed '1d')
            if [ -n "$OLD_CONTENT" ]; then
              FINAL_CONTENT="$FINAL_CONTENT$OLD_CONTENT"
            fi
          fi
          
          echo -e "$FINAL_CONTENT" > errors.md
          echo "✅ Na-update ang errors.md"
        shell: bash

      - name: ✅ Save errors.md
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update build log" 2>/dev/null || true
          git push 2>/dev/null || true
        shell: bash
ENDOFFILE

