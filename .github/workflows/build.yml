name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'guitarfx'
          - 'updater'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Create Log Folder
        run: |
          mkdir -p /tmp/build_logs
          chmod 777 /tmp/build_logs
          echo "✅ Folder ready"

      - name: 🔨 Build GuitarFX
        id: build_guitarfx
        if: ${{ github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all' }}
        run: |
          LOG_FILE="/tmp/build_logs/guitarfx.log"
          APK_FILE="apps/GuitarFX/build/outputs/apk/debug/GuitarFX-debug.apk"
          
          echo "=== START BUILD: $(date) ===" > "$LOG_FILE"
          cd apps/GuitarFX
          chmod +x gradlew
          ./gradlew assembleDebug >> "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> "$LOG_FILE"
          
          echo "guitarfx_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "guitarfx_log=$LOG_FILE" >> $GITHUB_OUTPUT
          echo "guitarfx_apk=$APK_FILE" >> $GITHUB_OUTPUT
          
          ls -la "$LOG_FILE"

      - name: 🔨 Build Updater
        id: build_updater
        if: ${{ github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all' }}
        run: |
          LOG_FILE="/tmp/build_logs/updater.log"
          APK_FILE="apps/GitHubUpdater/build/outputs/apk/debug/app-debug.apk"
          
          echo "=== START BUILD: $(date) ===" > "$LOG_FILE"
          cd apps/GitHubUpdater
          chmod +x gradlew
          ./gradlew assembleDebug >> "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> "$LOG_FILE"
          
          echo "updater_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "updater_log=$LOG_FILE" >> $GITHUB_OUTPUT
          echo "updater_apk=$APK_FILE" >> $GITHUB_OUTPUT
          
          ls -la "$LOG_FILE"

      - name: 📤 Upload GuitarFX APK
        uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all') }}
        with:
          name: GuitarFX-APK
          path: apps/GuitarFX/build/outputs/apk/debug/GuitarFX-debug.apk
          retention-days: 30

      - name: 📤 Upload Updater APK
        uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all') }}
        with:
          name: MartoDosko-Updater-APK
          path: apps/GitHubUpdater/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd $GITHUB_WORKSPACE
          
          FINAL_CONTENT="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"
          
          if [[ "${{ github.event.inputs.build_target }}" == "guitarfx" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            APK_PATH="${{ steps.build_guitarfx.outputs.guitarfx_apk }}"
            LOG_PATH="${{ steps.build_guitarfx.outputs.guitarfx_log }}"
            EXIT="${{ steps.build_guitarfx.outputs.guitarfx_exit_code }}"
            
            if [ "$EXIT" = "0" ] && [ -f "$APK_PATH" ]; then
              SIZE=$(du -h "$APK_PATH" | cut -f1)
              FINAL_CONTENT+="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $SIZE\n"
            else
              FINAL_CONTENT+="❌ ERROR — GuitarFX — $DATE — Nabigo (Code: $EXIT)\n"
            fi
            
            if [ -f "$LOG_PATH" ]; then
              LOG_CONTENT=$(tail -60 "$LOG_PATH")
              FINAL_CONTENT+="\n### 📋 BUONG LOG:\n\`\`\`\n$LOG_CONTENT\n\`\`\`\n"
            else
              FINAL_CONTENT+="\n### ⚠️ WALANG LOG FILE SA: $LOG_PATH\n"
            fi
            FINAL_CONTENT+="---\n"
          fi
          
          if [[ "${{ github.event.inputs.build_target }}" == "updater" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            APK_PATH="${{ steps.build_updater.outputs.updater_apk }}"
            LOG_PATH="${{ steps.build_updater.outputs.updater_log }}"
            EXIT="${{ steps.build_updater.outputs.updater_exit_code }}"
            
            if [ "$EXIT" = "0" ] && [ -f "$APK_PATH" ]; then
              SIZE=$(du -h "$APK_PATH" | cut -f1)
              FINAL_CONTENT+="✅ TAGUMPAY — MartoDosko Updater — $DATE — Laki: $SIZE\n"
            else
              FINAL_CONTENT+="❌ ERROR — MartoDosko Updater — $DATE — Nabigo (Code: $EXIT)\n"
            fi
            
            if [ -f "$LOG_PATH" ]; then
              LOG_CONTENT=$(tail -60 "$LOG_PATH")
              FINAL_CONTENT+="\n### 📋 BUONG LOG:\n\`\`\`\n$LOG_CONTENT\n\`\`\`\n"
            else
              FINAL_CONTENT+="\n### ⚠️ WALANG LOG FILE SA: $LOG_PATH\n"
            fi
            FINAL_CONTENT+="---\n"
          fi
          
          if [ -f errors.md ]; then
            OLD_CONTENT=$(cat errors.md)
            OLD_CONTENT=$(echo "$OLD_CONTENT" | sed -n '/^---$/,$p' | sed '1d')
            if [ -n "$OLD_CONTENT" ]; then
              FINAL_CONTENT="$FINAL_CONTENT$OLD_CONTENT"
            fi
          fi
          
          echo -e "$FINAL_CONTENT" > errors.md
          echo "✅ Na-update ang errors.md"
        shell: /usr/bin/bash -e {0}

      - name: ✅ Commit & Push
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml errors.md
          git commit -m "🔄 FIX: Siguradong Log File + APK Artifacts" 2>/dev/null || true
          git push 2>/dev/null || true
        shell: bash
