name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'guitarfx'
          - 'updater'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Prepare Log Folder
        run: mkdir -p /tmp/build_logs

      # ===== GUITARFX — WALANG BINAGO =====
      - name: 🔨 Build GuitarFX
        id: build_guitarfx
        if: ${{ github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all' }}
        run: |
          LOG_FILE="/tmp/build_logs/guitarfx.log"
          echo "=== START: $(date) ===" > "$LOG_FILE"
          cd apps/GuitarFX
          chmod +x gradlew
          ./gradlew assembleDebug >> "$LOG_FILE" 2>&1
          EXIT=$?
          echo "EXIT=$EXIT" >> "$LOG_FILE"
          APK=$(find . -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "log_file=$LOG_FILE" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          exit $EXIT

      - name: 📤 Upload GuitarFX APK
        if: ${{ always() && steps.build_guitarfx.outputs.apk_path && (github.event.inputs.build_target == 'guitarfx' || github.event.inputs.build_target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFX-APK
          path: ${{ steps.build_guitarfx.outputs.apk_path }}

      # ===== UPDATER — IDINAGDAG LANG =====
      - name: 🔨 Build GitHubUpdater
        id: build_updater
        if: ${{ github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all' }}
        run: |
          LOG_FILE="/tmp/build_logs/updater.log"
          echo "=== START: $(date) ===" > "$LOG_FILE"
          cd apps/GitHubUpdater
          [ -f gradlew ] && chmod +x gradlew
          ./gradlew assembleDebug >> "$LOG_FILE" 2>&1
          EXIT=$?
          echo "EXIT=$EXIT" >> "$LOG_FILE"
          APK=$(find . -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "log_file=$LOG_FILE" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          exit $EXIT

      - name: 📤 Upload Updater APK
        if: ${{ always() && steps.build_updater.outputs.apk_path && (github.event.inputs.build_target == 'updater' || github.event.inputs.build_target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: GitHubUpdater-APK
          path: ${{ steps.build_updater.outputs.apk_path }}

      # ===== ERRORS.MD — BALIK SA ORIHINAL =====
      - name: 📝 Update errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          cd $GITHUB_WORKSPACE
          OUT="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n"

          if [[ "${{ github.event.inputs.build_target }}" == "updater" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            E="${{ steps.build_updater.outputs.exit_code }}"
            A="${{ steps.build_updater.outputs.apk_path }}"
            if [ "$E" = "0" ] && [ -n "$A" ] && [ -f "$A" ]; then
              S=$(du -h "$A" | cut -f1)
              OUT+="✅ TAGUMPAY — GitHubUpdater — $DATE — Laki: $S\n"
            else
              OUT+="❌ NABIGO — GitHubUpdater — $DATE — Code: $E\n"
            fi
            OUT+="---\n"
          fi

          if [[ "${{ github.event.inputs.build_target }}" == "guitarfx" || "${{ github.event.inputs.build_target }}" == "all" ]]; then
            E="${{ steps.build_guitarfx.outputs.exit_code }}"
            A="${{ steps.build_guitarfx.outputs.apk_path }}"
            if [ "$E" = "0" ] && [ -n "$A" ] && [ -f "$A" ]; then
              S=$(du -h "$A" | cut -f1)
              OUT+="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $S\n"
            else
              OUT+="❌ NABIGO — GuitarFX — $DATE — Code: $E\n"
            fi
            OUT+="---\n"
          fi

          [ -f errors.md ] && echo -e "$OUT\n$(cat errors.md | sed -n '/^---$/,$p' | sed '1d')" > errors.md || echo -e "$OUT" > errors.md
        shell: bash

      - name: ✅ Save errors.md
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update errors.md" || true
          git push || true
