name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 ALIN ANG BUBUUIN? — DOON LANG TUTOK!'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'guitarfx'
          - 'updater'

jobs:
  build:
    name: 📱 BUILD — ${{ inputs.build_target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Kunin ang Repository
        uses: actions/checkout@v4

      - name: 📂 ISTRUKTURA — PARA SIGURADO
        run: |
          echo "=== apps/ folder ==="
          ls -la apps/
          echo ""
          echo "🎯 TARGET: ${{ inputs.build_target }}"

      - name: ☕ Ihanda ang JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🎸 BUUUIN ANG GUITARFX
        if: inputs.build_target == 'guitarfx' || inputs.build_target == 'all'
        working-directory: apps/GuitarFX
        run: |
          echo "📂 Nasa: $PWD"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            echo "✅ APK NABUO!"
            ls -lh "$APK_FILE"
            echo "GUITARFX_APK=$PWD/$APK_FILE" >> $GITHUB_ENV
          else
            echo "❌ WALANG APK NABUO SA: $PWD/$APK_FILE"
            find . -name "*.apk" -type f 2>/dev/null
            exit 1
          fi

      - name: 🔄 BUUUIN ANG MARTODOSKO UPDATER
        if: inputs.build_target == 'updater' || inputs.build_target == 'all'
        working-directory: apps/GitHubUpdater
        run: |
          echo "📂 Nasa: $PWD"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            echo "✅ APK NABUO!"
            ls -lh "$APK_FILE"
            echo "UPDATER_APK=$PWD/$APK_FILE" >> $GITHUB_ENV
          else
            echo "❌ WALANG APK NABUO SA: $PWD/$APK_FILE"
            find . -name "*.apk" -type f 2>/dev/null
            exit 1
          fi

      - name: 📤 I-UPLOAD — GuitarFX APK
        if: inputs.build_target == 'guitarfx' || inputs.build_target == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFX-APK
          path: ${{ env.GUITARFX_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: 📤 I-UPLOAD — Updater APK
        if: inputs.build_target == 'updater' || inputs.build_target == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: MartoDosko-Updater-APK
          path: ${{ env.UPDATER_APK }}
          if-no-files-found: error
          retention-days: 30
