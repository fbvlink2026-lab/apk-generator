name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'apk:') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📦 Grant Execute Permission
        run: chmod +x apps/GuitarFX/gradlew

      - name: 🔨 Build APK
        run: |
          cd apps/GuitarFX
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_output.log
        shell: bash

      - name: 🔍 HANAPIN ANG APK — SIGURADUHIN NASAAN!
        id: find_apk
        run: |
          echo "=== HINAHANAP ANG APK FILE... ==="
          find apps/GuitarFX -name "*.apk"
          
          APK_FILE=$(find apps/GuitarFX -name "*debug*.apk" | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "✅ NAKITA ANG APK SA: $APK_FILE"
            echo "APK_PATH=$APK_FILE" >> $GITHUB_OUTPUT
          else
            echo "❌ HINDI NAKITA ANG APK!"
            exit 1
          fi

      - name: 📤 Upload APK — GAMIT ANG TAMANG PATH!
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GuitarFX-APK
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 30

      - name: 📝 Update errors.md — WALANG PUSH!
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          APK_FILE=$(find apps/GuitarFX -name "*debug*.apk" | head -1)
          
          if [ -f "$APK_FILE" ]; then
            SIZE=$(du -h "$APK_FILE" | cut -f1)
            LINE="✅ TAGUMPAY — GuitarFX — $DATE — Laki: $SIZE"
          else
            LINE="❌ ERROR — GuitarFX — $DATE — Hindi nakita ang APK"
          fi
          
          NEW_ENTRY="$LINE\n---\n"
          
          if [ -f errors.md ]; then
            OLD_CONTENT=$(cat errors.md)
            FINAL="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n$NEW_ENTRY$OLD_CONTENT"
          else
            FINAL="# Talaan ng mga Error\n\n> Created & Developed by MartoDosko © Copyright 2026\n\n$NEW_ENTRY"
          fi
          
          echo -e "$FINAL" > errors.md
          echo "✅ Na-update ang errors.md"
        shell: /usr/bin/bash -e {0}
