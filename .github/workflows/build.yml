name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'guitarfx'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 ANO ANG NASA apps/? — TIGNAN NG MABUTI
        run: |
          echo "=========================================="
          echo "   📂 BUONG LAMAN NG apps/"
          echo "=========================================="
          ls -la apps/
          echo ""
          echo "=========================================="
          echo "   📂 MGA SUB-FOLDER:"
          echo "=========================================="
          for d in apps/*/; do
            echo "→ $d"
          done
          echo ""
          if [ -d "apps/GitHubUpdater" ]; then
            echo "✅ NAKITA: apps/GitHubUpdater — UMIIRAL!"
          else
            echo "❌ HINDI MAHANAP: apps/GitHubUpdater — WALA DITO!"
          fi
          echo ""
          if [ -d "apps/guitarfx" ]; then
            echo "✅ NAKITA: apps/guitarfx — UMIIRAL!"
          else
            echo "❌ HINDI MAHANAP: apps/guitarfx — WALA DITO!"
          fi

      - name: 🔨 Build at Kumuha ng Log
        id: do_build
        run: |
          mkdir -p /tmp
          TARGET="${{ github.event.inputs.build_target }}"
          > /tmp/errors-content.txt

          echo "🎯 PINILI: $TARGET"

          # ✅ DIRETSONG TIGNAN — WALANG KUMplikADONG FIND
          if [ "$TARGET" = "all" ]; then
            APPS=()
            [ -d "apps/GitHubUpdater" ] && APPS+=("apps/GitHubUpdater")
            [ -d "apps/guitarfx" ] && APPS+=("apps/guitarfx")
            echo "✅ LAHAT NG APP: ${APPS[*]}"
          elif [ "$TARGET" = "GitHubUpdater" ] && [ -d "apps/GitHubUpdater" ]; then
            APPS=("apps/GitHubUpdater")
          elif [ "$TARGET" = "guitarfx" ] && [ -d "apps/guitarfx" ]; then
            APPS=("apps/guitarfx")
          else
            echo "❌ WALANG TUGMANG FOLDER SA: $TARGET"
            APPS=()
          fi

          if [ ${#APPS[@]} -eq 0 ]; then
            echo "⚠️ WALANG APP NA IPAPROSESO"
            exit 0
          fi

          for DIR in "${APPS[@]}"; do
            NAME=$(basename "$DIR")
            LOG="/tmp/$NAME-build.log"

            echo ""
            echo "--- BUILD: $NAME ---"
            cd "$DIR"

            # ✅ AYUSIN ANG GRADLE WRAPPER
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(wc -c < gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 10000 ]; then
              echo "⚠️ Ayusin ang gradle-wrapper..."
              rm -f gradle/wrapper/gradle-wrapper.jar 2>/dev/null
              gradle wrapper --gradle-version 8.2
              chmod +x gradlew
            fi
            chmod +x gradlew

            ./gradlew assembleDebug > "$LOG" 2>&1 || true
            EXIT=$?
            APK=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)

            {
              echo "===== $NAME ====="
              if [ -n "$APK" ] && [ -f "$APK" ]; then
                echo "✅ TAGUMPAY"
                echo "APK: $APK"
              else
                echo "❌ NABIGO — Exit $EXIT"
              fi
              echo "--- BUONG LOG ---"
              cat "$LOG"
              echo "=================="
              echo ""
            } >> /tmp/errors-content.txt

            cd "$GITHUB_WORKSPACE"
          done

      - name: 📝 Isulat sa errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# Talaan ng mga Build"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "📅 $DATE — 🎯 ${{ github.event.inputs.build_target }}"
            echo "---"
            echo ""
            if [ -f /tmp/errors-content.txt ] && [ -s /tmp/errors-content.txt ]; then
              cat /tmp/errors-content.txt
            else
              echo "⚠️ Walang naprosesang app."
              echo ""
              echo "💡 TIGNAN ANG HAKBANG SA ITAAS — 'ANO ANG NASA apps/?'"
              echo "Makikita mo doon kung anong mga folder talaga ang umiiral."
            fi
          } > errors.md
          cat errors.md

      - name: 📤 Ipadala APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: apps/*/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ I-commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update build log" || true
          git push || true
