name: Build APK

on:
  push:
    paths:
      - 'apps/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'GuitarFX'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

# ==============================================
# ✅ BAGONG DAGDAG: KUNIN ANG BERSYON MULA SA TAG
# ==============================================
      - name: 🏷️ KUNIN ANG BERSYON — AWTO DETECT
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v6.0.4")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Bersyon na nakita: $VERSION_TAG  →  versionName: $VERSION_NAME  |  versionCode: $VERSION_CODE"

      - name: ✍️ ISULAT ANG BERSYON SA build.gradle
        run: |
          FILE="apps/GitHubUpdater/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" "$FILE"
            echo "✅ Nai-update ang build.gradle:"
            grep -E "versionCode|versionName" "$FILE"
          else
            echo "⚠️ Hindi nakita ang $FILE — laktawan"
          fi

      - name: 📋 LISTAHAN NG FOLDER
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA REPOSITORY"
          echo "=========================================="
          find . -maxdepth 5 -type d | grep -v '.git' | sort

      - name: 🔨 BUILD APK + BUONG LOG
        id: do_build
        run: |
          mkdir -p /tmp
          TARGET="${{ github.event.inputs.build_target }}"
          ERROR_FILE="/tmp/errors-content.txt"
          > "$ERROR_FILE"

          FIND_APP() {
            local NAME="$1"
            if [ -d "apps/$NAME" ]; then echo "apps/$NAME"; return 0; fi
            if [ -d "$NAME" ]; then echo "$NAME"; return 0; fi
            return 1
          }

          declare -a APPS=()
          if [ "$TARGET" = "all" ]; then
            DIR=$(FIND_APP GitHubUpdater) && APPS+=("$DIR")
            DIR=$(FIND_APP GuitarFX) && APPS+=("$DIR")
          else
            DIR=$(FIND_APP "$TARGET") && APPS+=("$DIR")
          fi

          echo "✅ IPAPROSESO: ${APPS[*]}"
          if [ ${#APPS[@]} -eq 0 ]; then
            echo "⚠️ WALANG MAHANAP NA APP"
            echo "# ⚠️ Walang napiling aplikasyon o hindi matagpuan ang folder" >> "$ERROR_FILE"
            exit 0
          fi

          for DIR in "${APPS[@]}"; do
            NAME=$(basename "$DIR")
            LOG_FILE="/tmp/$NAME-build-full.log"

            echo ""
            echo "--- BUILD: $NAME — $DIR ---"
            cd "$DIR" || continue

            # ✅ I-SETUP ANG GRADLE
            if [ ! -f "gradlew" ]; then
              wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp
              export PATH=/tmp/gradle-8.2/bin:$PATH
              gradle wrapper --gradle-version 8.2
            fi
            chmod +x gradlew

            # ✅ BUILD — KUKUHAIN ANG BUONG OUTPUT KASAMA ANG ERROR
            set +e
            ./gradlew assembleDebug > "$LOG_FILE" 2>&1
            EXIT_CODE=$?
            set -e

            # ✅ HANAPIN ANG APK
            APK_FILE=$(find . -name "*.apk" -path "*/debug/*" | head -1)

            {
              echo "=================================================="
              echo "📦 APLIKASYON: $NAME"
              echo "📂 LOKASYON:   $DIR"
              echo "⏰ ORAS:       $(date '+%Y-%m-%d %H:%M:%S UTC')"
              echo "🏷️ BERSYON:    ${{ steps.version.outputs.tag }}"
              echo "=================================================="
              echo ""

              if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
                APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
                echo "✅ TAGUMPAY — NABUO ANG APK!"
                echo "📂 APK Daan:   $DIR/$APK_FILE"
                echo "📏 Laki:       $APK_SIZE"
                echo "📤 Kopyahin sa docs/..."
                mkdir -p "$GITHUB_WORKSPACE/docs"
# ==============================================
# ✅ BAGONG DAGDAG: install- SA UNAHAN NG PANGALAN
# ==============================================
                NEW_APK_NAME="install-${NAME}-${{ steps.version.outputs.tag }}.apk"
                cp "$APK_FILE" "$GITHUB_WORKSPACE/docs/$NEW_APK_NAME"
                echo "✅ Nasa: docs/$NEW_APK_NAME"
              else
                echo "❌ NABIGO — Hindi nabuo o hindi mahanap ang APK"
                echo "🔑 Exit Code: $EXIT_CODE"
              fi

              echo ""
              echo "--------------------------------------------------"
              echo "📋 BUONG LOG NG BUILD:"
              echo "--------------------------------------------------"
              cat "$LOG_FILE"
              echo ""
              echo "=================================================="
              echo ""
            } >> "$ERROR_FILE"

            cd "$GITHUB_WORKSPACE"
          done

      - name: 📄 SIGURADUHIN TAMA ANG PAGSULAT SA errors.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          OUTPUT_FILE="$GITHUB_WORKSPACE/errors.md"
          TEMP_FILE="/tmp/errors-final.md"

          {
            echo "# 📋 Talaan ng mga Build"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🎯 **Target:** ${{ github.event.inputs.build_target }}"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            cat /tmp/errors-content.txt
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TEMP_FILE"

          cp "$TEMP_FILE" "$OUTPUT_FILE"

          echo "✅ errors.md naisulat na!"

      - name: 📂 HUTIN SA UGAT — WALANG SUBFOLDER SA ARTIFACT
        if: always()
        run: |
          mkdir -p /tmp/APK_ROOT
          find docs -name "*.apk" -exec cp {} /tmp/APK_ROOT/ \;
          echo "✅ APK na nasa artifact:"
          ls -lh /tmp/APK_ROOT/

      - name: 📤 I-UPLOAD — APK LANG, WALANG SUBFOLDER
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}-${{ steps.version.outputs.tag }}
          path: /tmp/APK_ROOT/
          retention-days: 30

      - name: ✅ I-COMMIT — errors.md + APK sa docs/ + na-update na build.gradle
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md docs/*.apk 2>/dev/null || true
          git add apps/GitHubUpdater/app/build.gradle 2>/dev/null || true
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — ${{ github.event.inputs.build_target }}" || true
          git push || true
