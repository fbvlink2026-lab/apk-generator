name: Build APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: '📌 Alin ang gusto mong buuin?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'GitHubUpdater'
          - 'guitarfx'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 Anong mga folder ang nakita?
        run: |
          echo "=== MGA FOLDER SA apps/ ==="
          ls -la apps/
          find apps -maxdepth 1 -mindepth 1 -type d

      - name: 🔨 Build at Kumuha ng Log
        id: do_build
        run: |
          mkdir -p /tmp
          TARGET="${{ github.event.inputs.build_target }}"

          if [ "$TARGET" = "all" ]; then
            APPS=$(find apps -maxdepth 1 -mindepth 1 -type d)
          else
            APPS="apps/$TARGET"
          fi

          echo "APPS=$APPS" >> $GITHUB_OUTPUT
          > /tmp/errors-content.txt

          for DIR in $APPS; do
            NAME=$(basename "$DIR")
            LOG="/tmp/$NAME-build.log"

            echo "--- BUILD: $NAME ---"
            cd "$DIR"
            [ ! -f gradlew ] && gradle wrapper && chmod +x gradlew
            chmod +x gradlew

            ./gradlew assembleDebug > "$LOG" 2>&1 || true
            EXIT=$?
            APK=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)

            {
              echo "===== $NAME ====="
              if [ -n "$APK" ]; then
                echo "✅ TAGUMPAY"
                echo "APK: $APK"
              else
                echo "❌ NABIGO — Exit $EXIT"
              fi
              echo "--- BUONG LOG ---"
              cat "$LOG"
              echo "=================="
              echo ""
            } >> /tmp/errors-content.txt
          done

      - name: 📝 Isulat sa errors.md — SIGURADONG TATAKBO
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# Talaan ng mga Build"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "📅 $DATE — 🎯 ${{ github.event.inputs.build_target }}"
            echo "---"
            echo ""
            if [ -f /tmp/errors-content.txt ] && [ -s /tmp/errors-content.txt ]; then
              cat /tmp/errors-content.txt
            else
              echo "⚠️ Walang naprosesang app."
              echo "Tingnan ang hakbang 'Anong mga folder ang nakita?' sa itaas."
            fi
          } > errors.md

          echo "✅ Naisulat na ang errors.md — laman:"
          cat errors.md

      - name: 📤 Ipadala APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.event.inputs.build_target }}
          path: apps/*/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: ✅ I-commit ang errors.md
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add errors.md
          git commit -m "📝 Update build log" || true
          git push || true
