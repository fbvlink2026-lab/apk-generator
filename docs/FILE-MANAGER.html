<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📂 Buong Istraktura ng Repositoryo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #f6f8fa; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #0969da; text-decoration: none; }
        h1 { color: #24292f; text-align: center; margin-bottom: 20px; }
        .tree { background: white; border-radius: 10px; border: 1px solid #ddd; }
        .tree-header { background: #f3f4f6; padding: 12px 16px; border-bottom: 1px solid #ddd; font-weight: bold; }
        .tree-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f3f4f6; }
        .tree-item:hover { background: #eaf4ff; }
        .folder-content { display: none; padding-left: 28px; }
        .folder-open > .folder-content { display: block; }
        .chevron { transition: transform 0.2s; font-size: 12px; width: 16px; display: inline-block; }
        .folder-open > .tree-item > .chevron { transform: rotate(90deg); }
        a { text-decoration: none; color: inherit; flex: 1; }
        .loading { padding: 20px; text-align: center; color: #666; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Bumalik sa Pangunahing Pahina</a>
    <h1>📂 Buong Istraktura ng Repositoryo</h1>

    <div class="tree">
        <div class="tree-header">📂 apk-generator / — Ugat ng Repositoryo</div>
        <div id="repoTree" class="folder-open">
            <div class="loading">⏳ Binabasa ang buong repositoryo...</div>
        </div>
    </div>

<script>
// ✅ ITO ANG PANGALAN NG REPOSITORYO MO
const REPO_OWNER = "fbvlink2026";
const REPO_NAME  = "apk-generator";

// ✅ BABASAHIN ANG BUONG REPOSITORYO MULA SA UGAT!
async function loadRepoTree() {
    const container = document.getElementById("repoTree");
    container.innerHTML = "<div class='loading'>⏳ Binabasa...</div>";

    try {
        // ✅ KUNIN ANG LISTAHAN NG LAHAT NG FILES MULA SA UGAT
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/main?recursive=1`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.tree) {
            container.innerHTML = "<div class='loading'>❌ Hindi mabasa ang repositoryo</div>";
            return;
        }

        // ✅ BUUIN ANG ISTRAKTURA NG PUNO
        const root = { children: {} };
        data.tree.forEach(item => {
            const parts = item.path.split("/");
            let current = root;
            parts.forEach((part, idx) => {
                if (!current.children[part]) {
                    current.children[part] = {
                        name: part,
                        path: parts.slice(0, idx+1).join("/"),
                        type: idx === parts.length-1 ? item.type : "tree",
                        children: {}
                    };
                }
                current = current.children[part];
            });
        });

        // ✅ LIKHA ANG HTML MULA SA ISTRAKTURA
        function renderFolder(node, fullPath = "") {
            let html = "";
            for (const name in node.children) {
                const item = node.children[name];
                const itemPath = fullPath ? `${fullPath}/${name}` : name;

                if (item.type === "tree") {
                    // 📁 FOLDER
                    html += `
                        <div class="folder-open">
                            <div class="tree-item" onclick="toggleFolder(this.parentElement)">
                                <span class="chevron">▶</span> 📁 <span>${name}</span>
                            </div>
                            <div class="folder-content">
                                ${renderFolder(item, itemPath)}
                            </div>
                        </div>`;
                } else {
                    // 📄 FILE — PUPUNTA SA VIEW-MD.html + TUNAY NA LAMAN
                    const encodedPath = encodeURIComponent(itemPath);
                    html += `
                        <div class="tree-item">
                            📄 <a href="VIEW-MD.html?f=${encodedPath}">${name}</a>
                        </div>`;
                }
            }
            return html;
        }

        container.innerHTML = renderFolder(root);

    } catch(err) {
        container.innerHTML = `<div class='loading'>❌ May mali: ${err.message}</div>`;
    }
}

function toggleFolder(el) { el.classList.toggle('folder-open'); }

window.onload = loadRepoTree;
</script>

</body>
</html>
