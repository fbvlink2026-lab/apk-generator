<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumento — APK Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f0f4f8; padding: 20px; max-width: 900px; margin: 0 auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .btn { display: inline-block; background: #3b82f6; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; font-size: 15px; }
    .btn:hover { background: #2563eb; }
    .btn-green { background: #28c76f; }
    .btn-green:hover { background: #1fb05f; }
    .content-box { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-height: 300px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.7; color: #1f2937; font-size: 15px; }
    .loading { color: #666; font-style: italic; text-align: center; padding: 40px; }
    .dev { text-align:center; margin-top:30px; padding-top:20px; border-top:1px solid #e5e7eb; color:#6b7280; font-size:14px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a id="backLink" href="index.html" class="btn">🔙 Bumalik sa Pangunahing Pahina</a>
    <button id="copyBtn" class="btn btn-green">📋 Kopyahin ang Laman</button>
  </div>

  <div class="content-box" id="content">
    <p class="loading">⏳ Binabasa ang dokumento...</p>
  </div>

<script>
const BASE_RAW = "https://raw.githubusercontent.com/fbvlink2026-lab/apk-generator/main/";

window.onload = loadFile;

async function loadFile() {
  const params = new URLSearchParams(window.location.search);
  const filePath = params.get("f");
  const fromMgr = params.get("m") === "1";
  const contentBox = document.getElementById("content");
  const copyBtn = document.getElementById("copyBtn");
  const backLink = document.getElementById("backLink");

  if (fromMgr) {
    backLink.href = "FILE-MANAGER.html";
    backLink.textContent = "🔙 Bumalik sa Listahan ng File";
  }

  if (!filePath) {
    contentBox.textContent = "❌ Walang napiling dokumento.";
    copyBtn.style.display = "none";
    return;
  }

  try {
    const res = await fetch(BASE_RAW + encodeURIComponent(filePath));
    if (!res.ok) throw new Error("Hindi makuha ang file");
    const text = await res.text();
    contentBox.textContent = text;

    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = "✅ Nakopya na!";
        setTimeout(() => { copyBtn.textContent = "📋 Kopyahin ang Laman"; }, 2000);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        copyBtn.textContent = "✅ Nakopya na!";
        setTimeout(() => { copyBtn.textContent = "📋 Kopyahin ang Laman"; }, 2000);
      }
    };

  } catch(err) {
    contentBox.textContent = "❌ Hindi mabasa ang dokumento:\n\n" + err.message;
    copyBtn.style.display = "none";
  }
}
</script>

  <div class="dev">Developed by MartoDosko © Copyright 2026</div>

</body>
</html>
