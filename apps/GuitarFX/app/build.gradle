plugins {
    id 'com.android.application'
}

android {
    namespace 'com.martodosko.guitarfx'
    compileSdk 34

    defaultConfig {
        applicationId "com.martodosko.guitarfx"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
ENDOFFILE
echo "✅ NA-SAVE: app/build.gradle"

# ─── FILE 4: Ayusin AndroidManifest.xml — tanggalin ang package= ───
MANIFEST="apps/GuitarFX/app/src/main/AndroidManifest.xml"
if [ -f "$MANIFEST" ]; then
    sed -i 's/[[:space:]]*package="[^"]*"//' "$MANIFEST"
    echo "✅ NA-AYOS: AndroidManifest.xml — tinanggal na ang package="
fi

echo ""
echo "=========================================="
echo "   ✅ LAHAT AY NA-AYOS NA!"
echo "   📌 Ipadala na gamit ang: martopush"
echo "=========================================="

